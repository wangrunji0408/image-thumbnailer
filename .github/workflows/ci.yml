name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test resources
        run: |
          cd Tests/ImageThumbnailerTests/Resources
          # Download public samples (|| true to not fail CI if download fails)
          curl -fL -o "DSC04618.ARW" "https://raw.pixls.us/data/Sony/ILCE-6000/DSC01542.ARW" || true
          curl -fL -o "IMG_5885.DNG" "https://raw.pixls.us/data/Apple/iPhone%2012%20Pro/IMG_1361.DNG" || true
          curl -fL -o "Nikon_Z5_2.NEF" "https://raw.pixls.us/data/Nikon/Z%208/Nikon_Z8_high_efficiency_low.NEF" || true
          curl -fL -o "Nikon_Z5.NEF" "https://raw.pixls.us/data/Nikon/Z%205/DSC_0520.NEF" || true
          ls -lh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build CLI release
        run: swift build -c release --product ImageThumbnailerCLI

  release:
    name: Release
    runs-on: macos-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          swift build -c release --product ImageThumbnailerCLI
          cp .build/release/ImageThumbnailerCLI ./image-thumbnailer-macos
          chmod +x image-thumbnailer-macos
          tar -czf image-thumbnailer-macos.tar.gz image-thumbnailer-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: image-thumbnailer-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
