name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled test resources
        run: python3 Tests/download_resources.py --verify-present

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build CLI release
        run: swift build -c release --product ImageThumbnailerCLI

  release:
    name: Release
    runs-on: macos-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          swift build -c release --product ImageThumbnailerCLI
          cp .build/release/ImageThumbnailerCLI ./image-thumbnailer-macos
          chmod +x image-thumbnailer-macos
          tar -czf image-thumbnailer-macos.tar.gz image-thumbnailer-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: image-thumbnailer-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
