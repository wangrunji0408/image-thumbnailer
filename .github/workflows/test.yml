name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test resources
        run: |
          cd Tests/ImageThumbnailerTests/Resources
          # Download public samples for formats not checked into git
          curl -fL -o "DSC04618.ARW" "https://raw.pixls.us/data/SONY/ILCE-6000/DSC02592.ARW" || true
          curl -fL -o "IMG_5885.DNG" "https://raw.pixls.us/data/Apple/iPhone%2012%20Pro/IMG_1361.DNG" || true
          curl -fL -o "高效压缩raw.NEF" "https://raw.pixls.us/data/Nikon/Z%208/Nikon_Z8_high_efficiency_low.NEF" || true
          curl -fL -o "无损压缩raw.NEF" "https://raw.pixls.us/data/Nikon/Z%205/DSC_0514.NEF" || true
          ls -lh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
